<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Mochi Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout concept: a kawaii "web frame" — striped scalloped awning, bear-ear panel, stacked bands
   (header / banner / tabs / content + sidebar / footer) separated by cocoa-brown outlines. */
:root{
  --ink:#6b443d; --ink2:#8a665b; --line:#a06d5f; --pinktxt:#d4507d;
  --page:#ffdfe9; --dots:#ffffff; --dots2:rgba(255,255,255,.62);
  --card:#fffefa; --paper:#fff8e3;
  --mix:40%; --mixs:16%;
  --pink-d:#f4799f; --blue-d:#58aee6; --mint-d:#63c07b; --lav-d:#a287e8; --peach-d:#f69a5f; --butter-d:#f3c13c;
  --pink:color-mix(in srgb,var(--pink-d) var(--mix),var(--card));
  --blue:color-mix(in srgb,var(--blue-d) var(--mix),var(--card));
  --mint:color-mix(in srgb,var(--mint-d) var(--mix),var(--card));
  --lav:color-mix(in srgb,var(--lav-d) var(--mix),var(--card));
  --peach:color-mix(in srgb,var(--peach-d) var(--mix),var(--card));
  --butter:color-mix(in srgb,var(--butter-d) var(--mix),var(--card));
  --pink-s:color-mix(in srgb,var(--pink-d) var(--mixs),var(--card));
  --blue-s:color-mix(in srgb,var(--blue-d) var(--mixs),var(--card));
  --mint-s:color-mix(in srgb,var(--mint-d) var(--mixs),var(--card));
  --lav-s:color-mix(in srgb,var(--lav-d) var(--mixs),var(--card));
  --peach-s:color-mix(in srgb,var(--peach-d) var(--mixs),var(--card));
  --butter-s:color-mix(in srgb,var(--butter-d) var(--mixs),var(--card));
  --acc-d:var(--pink-d); --acc:var(--pink); --acc-s:var(--pink-s);
  --sky1:#bfe3f7; --sky2:#fde6ee; --hill1:#c4ebbd; --hill2:#fbe9a3; --cloud:rgba(255,255,255,.85);
}
:root[data-accent="blue"]{--acc-d:var(--blue-d);--acc:var(--blue);--acc-s:var(--blue-s)}
:root[data-accent="mint"]{--acc-d:var(--mint-d);--acc:var(--mint);--acc-s:var(--mint-s)}
:root[data-accent="lav"]{--acc-d:var(--lav-d);--acc:var(--lav);--acc-s:var(--lav-s)}
:root[data-accent="peach"]{--acc-d:var(--peach-d);--acc:var(--peach);--acc-s:var(--peach-s)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#fbe9f0; --ink2:#d2b7c7; --line:#d49bb3; --pinktxt:#ffa9c6;
    --page:#2a1f35; --dots:#35283f; --dots2:rgba(255,255,255,.07);
    --card:#44354f; --paper:#382b44; --mix:32%; --mixs:14%;
    --sky1:#2b3563; --sky2:#5a3d6e; --hill1:#3d5b5c; --hill2:#5b4c5e; --cloud:rgba(255,255,255,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#fbe9f0; --ink2:#d2b7c7; --line:#d49bb3; --pinktxt:#ffa9c6;
  --page:#2a1f35; --dots:#35283f; --dots2:rgba(255,255,255,.07);
  --card:#44354f; --paper:#382b44; --mix:32%; --mixs:14%;
  --sky1:#2b3563; --sky2:#5a3d6e; --hill1:#3d5b5c; --hill2:#5b4c5e; --cloud:rgba(255,255,255,.22);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font:600 15px/1.45 Nunito,system-ui,sans-serif;
  background-color:var(--page);
  background-image:radial-gradient(var(--dots) 26%,transparent 28%),radial-gradient(var(--dots) 26%,transparent 28%);
  background-size:44px 44px; background-position:0 0,22px 22px;
  padding-block:20px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--acc-d);outline-offset:2px}

/* ---------- frame ---------- */
.frame{
  max-width:1040px;margin:0 auto;border:4px solid var(--line);border-radius:44px;overflow:hidden;
  background-color:var(--blue);
  background-image:radial-gradient(var(--dots2) 22%,transparent 24%);background-size:20px 20px;
  box-shadow:0 8px 0 color-mix(in srgb,var(--line) 40%,transparent);
}
.stripe{
  height:54px;
  background:repeating-linear-gradient(90deg,var(--pink) 0 14px,var(--card) 14px 28px);
  -webkit-mask-image:linear-gradient(#000 0 0),radial-gradient(circle at 14px 0,#000 13.5px,#0000 14px);
  mask-image:linear-gradient(#000 0 0),radial-gradient(circle at 14px 0,#000 13.5px,#0000 14px);
  -webkit-mask-size:100% calc(100% - 13px),28px 14px;mask-size:100% calc(100% - 13px),28px 14px;
  -webkit-mask-position:top,bottom;mask-position:top,bottom;
  -webkit-mask-repeat:no-repeat,repeat-x;mask-repeat:no-repeat,repeat-x;
}
.inner{padding:6px clamp(10px,2.6vw,26px) clamp(14px,3vw,26px)}
.pwrap{position:relative;margin-top:44px}
.pwrap::before,.pwrap::after{
  content:"";position:absolute;top:-38px;width:78px;height:42px;z-index:3;
  border:4px solid var(--line);border-bottom:0;border-radius:78px 78px 0 0;
  background:radial-gradient(circle at 50% 100%,var(--pink) 0 15px,transparent 16px),var(--butter);
}
.pwrap::before{left:15%}.pwrap::after{right:15%}
.panel{border:4px solid var(--line);border-radius:32px;overflow:hidden;background:var(--paper)}

.top{display:flex;align-items:center;gap:12px;padding:16px;background:var(--butter);border-bottom:3px solid var(--line);flex-wrap:wrap}
.chip{
  font:500 15px Fredoka,sans-serif;padding:8px 14px;border-radius:999px;background:var(--card);
  border:2.5px solid var(--pink-d);color:var(--ink);white-space:nowrap;
}
.title{
  flex:1 1 240px;min-width:0;text-align:center;font:500 clamp(22px,4.2vw,32px)/1.15 Fredoka,sans-serif;color:var(--pinktxt);
  background:var(--card);border:3px solid var(--pink-d);border-radius:999px;padding:8px 20px;overflow-wrap:anywhere;
}
.rbtns{display:flex;gap:8px}
.rbtn{
  width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--pink);font-size:20px;line-height:1;
  display:grid;place-items:center;box-shadow:0 3px 0 var(--line);transition:transform .12s;
}
.rbtn:nth-child(2){background:var(--blue)}.rbtn:nth-child(3){background:var(--mint)}
.rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.rbtn[aria-pressed="true"]{background:var(--butter-d);color:#5a3a1e}

/* ---------- banner ---------- */
.banner{
  position:relative;height:214px;margin:14px;border:3px solid var(--line);border-radius:22px;overflow:hidden;
  background:linear-gradient(var(--sky1),var(--sky2));
}
.cloud{position:absolute;height:26px;width:84px;border-radius:26px;background:var(--cloud);animation:drift 38s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:38px;height:38px;left:12px;top:-18px}.cloud::after{width:28px;height:28px;left:44px;top:-12px}
.c1{top:34px;left:-100px;animation-delay:-8s}.c2{top:92px;left:-100px;animation-duration:52s;animation-delay:-30s;transform:scale(.8)}.c3{top:20px;left:-100px;animation-duration:64s;animation-delay:-48s;transform:scale(.65)}
@keyframes drift{to{transform:translateX(calc(1100px));}}
.sp{position:absolute;color:#fff;font-size:14px;opacity:.9;animation:twinkle 3s ease-in-out infinite}
.s1{top:18px;right:18%}.s2{top:60px;right:8%;animation-delay:-1s}.s3{top:30px;right:34%;animation-delay:-2s;font-size:10px}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
.fly{position:absolute;top:50px;left:48%;font-size:22px;animation:fly 7s ease-in-out infinite alternate}
@keyframes fly{to{transform:translate(70px,-16px) rotate(8deg)}}
.hill{position:absolute;bottom:-70px;height:150px;border-radius:50%;border:3px solid color-mix(in srgb,var(--line) 55%,transparent)}
.h1{left:-8%;width:62%;background:var(--hill1)}.h2{right:-12%;width:68%;background:var(--hill2);bottom:-84px}
.bt{position:relative;z-index:2;padding:20px 22px;max-width:62%}
.hi{font:600 clamp(22px,4.4vw,32px)/1.12 Fredoka,sans-serif;color:var(--ink);text-wrap:balance}
.tag2{margin-top:6px;font:700 clamp(13px,2.4vw,16px)/1.3 Nunito,sans-serif;color:var(--ink2);overflow-wrap:anywhere}
.dchip{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:var(--card);border:2px dashed var(--line);font:500 14px Fredoka,sans-serif}
.pet{
  position:absolute;right:12%;bottom:8px;font-size:62px;line-height:1;background:none;border:0;padding:4px;z-index:3;
  animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12));
}
.pet:active{transform:scale(.9)}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{
  position:absolute;right:calc(12% + 52px);bottom:78px;z-index:4;padding:6px 12px;border-radius:14px;background:var(--card);
  border:2.5px solid var(--line);font:500 14px Fredoka,sans-serif;max-width:170px;animation:pop .25s;
}
.f1,.f2{position:absolute;bottom:6px;font-size:24px;z-index:2}.f1{left:6%}.f2{right:36%;font-size:20px;bottom:4px}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:8px;padding:12px;background-color:var(--pink);border-block:3px solid var(--line);
  background-image:radial-gradient(var(--dots2) 20%,transparent 22%);background-size:14px 14px;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs::before,.tabs::after{content:"";margin:auto}
.tab{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 15px;min-height:42px;border-radius:14px;
  border:2.5px dashed var(--line);background:var(--card);font:500 16px Fredoka,sans-serif;color:var(--ink);transition:transform .12s;
}
.tab:hover{transform:translateY(-2px) rotate(-1deg)}
.tab[aria-selected="true"]{background:var(--butter);border-style:solid;box-shadow:0 3px 0 var(--line);transform:translateY(-2px)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 292px}
.main{padding:20px;min-width:0;display:flex;flex-direction:column;gap:16px}
.side{
  padding:16px;display:flex;flex-direction:column;gap:14px;border-left:3px solid var(--line);min-width:0;
  background-color:var(--butter-s);background-image:radial-gradient(var(--dots2) 20%,transparent 22%);background-size:16px 16px;
}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{border-left:0;border-top:3px solid var(--line)}
  .bt{max-width:100%}
}
.foot{padding:14px;text-align:center;border-top:3px solid var(--line);background:repeating-linear-gradient(135deg,var(--pink) 0 12px,var(--card) 12px 24px)}
.pill{display:inline-block;min-width:180px;padding:6px 22px;border-radius:999px;border:2.5px dashed var(--line);background:var(--card);font:500 15px Fredoka,sans-serif;overflow-wrap:anywhere}
.made{margin-top:12px;text-align:center;font-size:13px;color:var(--ink);font-weight:700}

/* ---------- parts ---------- */
.ribbon{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font:500 20px Fredoka,sans-serif;padding:7px 20px;
  background:var(--acc);border:2.5px solid var(--line);border-radius:12px;outline:2px dashed color-mix(in srgb,var(--line) 60%,transparent);outline-offset:-7px;
}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:22px;padding:16px;min-width:0}
.card.soft{background:var(--acc-s)}
.small{font-size:13px;color:var(--ink2);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:999px;
  background:var(--acc);border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line);font:500 16px Fredoka,sans-serif;color:var(--ink);
  transition:transform .1s,box-shadow .1s,filter .15s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.05) saturate(1.1)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:36px;padding:5px 13px;font-size:15px}
.btn.ghost{background:var(--card)}
.btn.big{min-height:52px;padding:10px 24px;font-size:19px;background:var(--acc-d);color:#3d2420}
.round{width:40px;padding:0;border-radius:50%}
.chipb{
  min-height:34px;padding:4px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:500 15px Fredoka,sans-serif;
}
.chipb.on{background:var(--acc);box-shadow:0 2px 0 var(--line)}
.ib{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:14px;line-height:1;padding:0;display:grid;place-items:center;
}
.ib:hover{background:var(--butter)}
.ctl{display:none;gap:4px;flex:0 0 auto}
.editing .ctl{display:inline-flex}
.only-edit{display:none!important}
.editing .only-edit{display:flex!important}
.editnote{padding:10px 14px;border-radius:16px;background:var(--butter);border:2.5px dashed var(--line);font-weight:700;align-items:center;gap:8px}
.editing [data-ce]{outline:2px dashed var(--acc-d);outline-offset:3px;cursor:text}

input[type=text],input[type=number],input[type=date],input[type=time],input:not([type]),select,textarea{
  min-height:42px;padding:8px 12px;border-radius:14px;border:2.5px solid var(--line);background:var(--card);font-weight:700;min-width:0;
}
textarea{width:100%;resize:vertical;line-height:1.4}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input[type=text],.addrow input:not([type]){flex:1 1 180px}
.addrow select{flex:0 1 auto}

progress,.bar{display:block}
.bar{height:16px;border-radius:999px;background:var(--card);border:2.5px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--acc-d) 0 10px,color-mix(in srgb,var(--acc-d) 75%,#fff) 10px 20px);border-radius:999px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.bar.blue>i{background:repeating-linear-gradient(135deg,var(--blue-d) 0 10px,color-mix(in srgb,var(--blue-d) 75%,#fff) 10px 20px)}
.bar.mint>i{background:repeating-linear-gradient(135deg,var(--mint-d) 0 10px,color-mix(in srgb,var(--mint-d) 75%,#fff) 10px 20px)}

.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daypick{position:relative;flex:1 1 200px;min-width:0}
.daypick span{
  display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px 14px;border-radius:999px;background:var(--card);
  border:2.5px solid var(--line);font:500 16px Fredoka,sans-serif;text-align:center;
}
.daypick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

.lead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lead .bar{flex:1 1 160px}

/* tasks */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border:2.5px solid var(--line);border-radius:18px;background:var(--card);animation:pop .28s}
.task:nth-child(3n+2){background:var(--pink-s)}.task:nth-child(3n){background:var(--blue-s)}
.task.done .ttext{text-decoration:line-through;color:var(--ink2)}
.task.done{opacity:.8}
.chk{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:3px solid var(--line);background:var(--card);padding:0;position:relative;transition:transform .15s,background .15s;
}
.chk:hover{transform:scale(1.1)}
.task.done .chk,.chk[aria-checked="true"]{background:var(--acc-d);animation:pop .3s}
.task.done .chk::after,.chk[aria-checked="true"]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font:700 18px Fredoka;color:#3d2420}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ttext{font-weight:800;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);font-weight:700}
.tag{padding:1px 10px;border-radius:999px;background:var(--c);border:1.5px solid var(--line);color:var(--ink);font-weight:800}
.cat{font-size:22px}
.empty{padding:22px;text-align:center;border:2.5px dashed var(--line);border-radius:20px;color:var(--ink2);font-weight:700}
.empty b{display:block;font:500 28px Fredoka}
.carry{border-style:dashed;background:var(--peach-s)}

/* water */
.watergrid{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:560px){.watergrid{grid-template-columns:1fr;justify-items:center;text-align:center}}
.cup-svg{width:100%;max-width:200px;height:auto;display:block;overflow:visible}
.wave{animation:wv 2.4s linear infinite}
.wl{transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
@keyframes wv{to{transform:translateX(60px)}}
.big-n{font:600 clamp(32px,7vw,48px)/1 Fredoka,sans-serif}
.drops{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dropb{width:42px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--blue);font-size:22px;padding:0;transition:transform .12s,filter .2s}
.dropb.off{background:var(--card);filter:grayscale(1);opacity:.45}
.dropb:hover{transform:translateY(-3px)}
.wk{display:flex;gap:8px;align-items:flex-end;height:130px}
.wbar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;background:none;border:0;padding:0;font-size:12px;font-weight:800;color:var(--ink2)}
.wbar i{display:block;width:100%;max-width:44px;border-radius:12px 12px 4px 4px;border:2px solid var(--line);background:var(--blue-d);min-height:4px;transition:height .5s}
.wbar.sel i{background:var(--acc-d)}
.wbar.sel{color:var(--ink)}
.wbar b{font-size:11px;color:var(--ink)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:84px}

/* meals */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.slot h3{font:500 20px Fredoka,sans-serif;display:flex;gap:8px;align-items:center;margin-bottom:10px}
.slot h3 small{margin-left:auto;font:700 13px Nunito;color:var(--ink2)}
.meal{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:2px dotted color-mix(in srgb,var(--line) 50%,transparent)}
.meal .ttext{flex:1;min-width:0}
.meal.done .ttext{color:var(--ink2);text-decoration:line-through}
.kc{padding:1px 9px;border-radius:999px;background:var(--peach);border:1.5px solid var(--line);font-size:12.5px;font-weight:800;white-space:nowrap}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sugg button{padding:3px 10px;border-radius:999px;border:2px dashed var(--line);background:var(--paper);font-size:13px;font-weight:800}
.sugg button:hover{background:var(--butter)}
.mini-add{display:flex;gap:6px;margin-top:10px}
.mini-add input:first-child{flex:1;min-width:0}
.mini-add input[type=number]{width:78px}

/* mood */
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.mood{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:20px;border:2.5px solid var(--line);
  background:var(--card);font:500 15px Fredoka,sans-serif;transition:transform .15s;
}
.mood span{font-size:38px;line-height:1.1;transition:transform .2s}
.mood:hover span{transform:scale(1.2) rotate(-6deg)}
.mood[aria-pressed="true"]{background:var(--c);box-shadow:0 4px 0 var(--line);transform:translateY(-3px)}
.energy{display:flex;gap:6px}
.energy button{background:none;border:0;font-size:28px;padding:2px;filter:grayscale(1);opacity:.4;transition:transform .12s}
.energy button.on{filter:none;opacity:1}
.energy button:hover{transform:scale(1.2)}
.stepper{display:flex;align-items:center;gap:10px}

/* ---------- sidebar ---------- */
var T={min:25,left:1500,run:false,end:0,id:null},affI=0;
function mmss(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function updateTimer(){var a=$('#tmr'),b=$('#tgo');if(a)a.textContent=mmss(T.left);if(b)b.textContent=T.run?'pause':(T.left<T.min*60?'resume':'start')}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7);o.start();o.stop(c.currentTime+.7)}catch(e){}}
function tick(){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));updateTimer();
  if(T.left<=0){clearInterval(T.id);T.run=false;S.focus[TODAY()]=(S.focus[TODAY()]||0)+1;persist();T.left=T.min*60;beep();toast('focus session done! take a break ♡');render();var e=$('#tmr');if(e)burst(e)}}
function renderSide(){
  var day=ui.sel,isT=day===TODAY();
  var tl=S.tasks.filter(function(t){return t.date===day}),td=tl.filter(function(t){return t.done}).length;
  var wml=S.water[day]||0,wt=Math.max(1,S.settings.waterGoal)*Math.max(50,S.settings.glassMl);
  var slots={};S.meals.forEach(function(m){if(m.date===day&&m.done)slots[m.slot]=1});var ms=Math.min(3,['breakfast','lunch','dinner'].filter(function(s){return slots[s]}).length);
  var mo=S.mood[day],hd=S.habits.filter(function(h){return h.days[day]}).length;
  var P=[];
  if(tl.length)P.push({e:'🌸',l:'to-do',v:td/tl.length,t:td+'/'+tl.length,tab:'today'});
  P.push({e:'💧',l:'water',v:Math.min(1,wml/wt),t:wml+' ml',tab:'water'});
  P.push({e:'🍙',l:'meals',v:ms/3,t:ms+'/3 meals',tab:'meals'});
  P.push({e:'😊',l:'mood',v:mo&&mo.m!=null?1:0,t:mo&&mo.m!=null?MOODS[mo.m].e:'not yet',tab:'mood'});
  if(S.habits.length)P.push({e:'🌱',l:'habits',v:hd/S.habits.length,t:hd+'/'+S.habits.length,tab:'habits'});
  var all=P.reduce(function(a,p){return a+p.v},0)/P.length,C=2*Math.PI*36;
  var rb=S.books.filter(function(b){return b.status==='reading'})[0];
  $('#side').innerHTML=
  '<section class="scard"><h3>✿ '+(isT?'today':esc(fmtShort(day)))+'’s sparkle</h3><div class="ring"><div style="position:relative"><svg viewBox="0 0 88 88" aria-hidden="true"><circle cx="44" cy="44" r="36" fill="none" stroke="var(--acc-s)" stroke-width="10"/><circle cx="44" cy="44" r="36" fill="none" stroke="var(--acc-d)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-all)+'" style="transition:stroke-dashoffset .6s"/></svg><span class="pc" style="position:absolute;inset:0;display:grid;place-items:center">'+Math.round(all*100)+'%</span></div><p>'+(all>=1?'a perfect day!':all>.5?'lovely progress ♡':'every bit counts ✿')+'</p></div>'+
  '<div class="prog">'+P.map(function(p){return '<button data-act="jump" data-tab="'+p.tab+'"><span aria-hidden="true">'+p.e+'</span><span>'+p.l+'</span><span class="small">'+p.t+'</span>'+bar(p.v*100)+'</button>'}).join('')+'</div></section>'+
  '<section class="scard"><h3>🍅 focus timer</h3><div class="tmr" id="tmr">'+mmss(T.left)+'</div><div class="presets">'+[15,25,45].map(function(m){return '<button class="chipb'+(T.min===m?' on':'')+'" data-act="tset" data-m="'+m+'">'+m+'m</button>'}).join('')+'</div><div class="trow"><button class="btn sm" id="tgo" data-act="tgo">'+(T.run?'pause':'start')+'</button><button class="btn sm ghost" data-act="treset">reset</button></div><p class="small" style="text-align:center">sessions today: <b>'+(S.focus[TODAY()]||0)+'</b></p></section>'+
  (rb?'<section class="scard"><h3>📖 now reading</h3><b style="font:500 17px Fredoka;overflow-wrap:anywhere">'+esc(rb.title)+'</b>'+bar(rb.pages?rb.page/rb.pages*100:0,'blue')+'<button class="btn sm" data-act="jump" data-tab="books">open books</button></section>':'')+
  '<section class="scard"><h3>💌 for you</h3><p class="aff">“'+esc(AFF[affI%AFF.length])+'”</p><button class="btn sm ghost" data-act="affirm">new one ✿</button></section>';
}

/* ---------- render ---------- */
function applyTheme(){var r=document.documentElement,t=S.settings.theme;if(t)r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');r.setAttribute('data-accent',S.settings.accent||'pink')}

function setCE(){document.querySelectorAll('[data-ce]').forEach(function(el){if(document.activeElement!==el)el.textContent=S.settings[el.dataset.ce]||'';el.contentEditable=ui.edit?'true':'false';el.spellcheck=false})}

/* ---------- actions ---------- */
function find(arr,id){return S[arr].filter(function(x){return x.id===id})[0]}
function remove(arr,id){S[arr]=S[arr].filter(function(x){return x.id!==id})}
function ask(arr,id,what){confirmBox('Delete '+what+'? This cannot be undone.','delete',function(){remove(arr,id);persist();render();toast('deleted')})}
function addWater(n,el){
  var d=ui.sel,gl=Math.max(50,S.settings.glassMl),tot=Math.max(1,S.settings.waterGoal)*gl,was=S.water[d]||0;
  S.water[d]=Math.max(0,was+n);persist();render();
  if(was<tot&&S.water[d]>=tot){toast('daily water goal reached! 💧');var c=$('.cup-svg');if(c)burst(c,['💧','✨','♡'])}
}
function openSettings(){

  form('settings ⚙️',[
    {k:'name',label:'your name',value:s.name,attrs:'maxlength="24"'},
    {k:'title',label:'page title',value:s.title,attrs:'maxlength="40"'},
    {k:'tagline',label:'banner message',value:s.tagline,attrs:'maxlength="90"'},
    {k:'accent',type:'swatch',label:'colour theme',opts:[['pink','pink'],['blue','blue'],['mint','mint'],['lav','lavender'],['peach','peach']],value:s.accent},
    {pair:[{k:'pet',type:'select',label:'buddy',opts:PETS.map(function(p){return [p,p]}),value:s.pet},{k:'theme',type:'select',label:'look',opts:[['','match my device'],['light','day'],['dark','night']],value:s.theme}]},

    {pair:[{k:'kcalGoal',type:'number',label:'calorie goal',value:s.kcalGoal,attrs:'min="500" max="6000" step="50"'},{k:'bookGoal',type:'number',label:'books per year',value:s.bookGoal,attrs:'min="1" max="365"'}]}
  ],function(o){
    s.name=o.name.trim()||'friend';s.title=o.title.trim()||'My Planner';s.tagline=o.tagline.trim();s.accent=o.accent||'pink';s.pet=o.pet;s.theme=o.theme;
    s.waterGoal=Math.min(40,Math.max(1,+o.waterGoal||8));s.glassMl=Math.min(1500,Math.max(50,+o.glassMl||250));s.kcalGoal=Math.min(6000,Math.max(500,+o.kcalGoal||1800));s.bookGoal=Math.min(365,Math.max(1,+o.bookGoal||12));
    persist();render();toast('settings saved ✿');
  },{extra:'<div class="mextra"><button type="button" class="btn sm ghost" data-act="backup">💾 backup &amp; restore</button><button type="button" class="btn sm ghost" data-act="reset-all">🧺 start fresh</button></div>'});
}
function openBackup(){
  openModal({title:'backup & restore 💾',submit:null,html:'<p class="small">Your planner lives in this browser. Copy this text somewhere safe. To move to another device or restore, paste a backup below and press restore.</p><textarea id="bkText" rows="8" spellcheck="false" aria-label="Backup text">'+esc(JSON.stringify(S))+'</textarea><div class="mextra" style="border:0;padding:0"><button type="button" class="btn sm" data-act="bk-copy">copy</button><button type="button" class="btn sm ghost" data-act="bk-restore">restore from text</button></div>'});

function act(a,el,e){
  var id=el.dataset.id,t;
  switch(a){
  case 'tab':setTab(el.dataset.t);break;
  case 'jump':setTab(el.dataset.tab);window.scrollTo({top:0,behavior:'smooth'});break;
  case 'day':setSel(addDays(ui.sel,+el.dataset.n));break;
  case 'today':setSel(TODAY());break;
  case 'pickday':setSel(el.dataset.d);break;
  case 'pick':setSel(el.dataset.d);break;
  case 'edit-toggle':
    ui.edit=!ui.edit;document.body.classList.toggle('editing',ui.edit);
    ['btnEdit','fab'].forEach(function(i){$('#'+i).setAttribute('aria-pressed',ui.edit)});
    $('#fabTxt').textContent=ui.edit?'done':'edit';$('#btnEdit').textContent=ui.edit?'✓':'✎';setCE();
    toast(ui.edit?'edit mode on ✎ tap pencils and text to change things':'edit mode off ✓');break;
  case 'theme':S.settings.theme=isDark()?'light':'dark';persist();render();break;
  case 'settings':openSettings();break;
  case 'backup':openBackup();break;
  case 'bk-copy':
    t=$('#bkText');t.select();
    try{navigator.clipboard.writeText(t.value).then(function(){toast('copied ♡')},function(){toast('selected. press copy on your keyboard')})}catch(x){toast('selected. press copy on your keyboard')}break;
  case 'bk-restore':
    try{var o=JSON.parse($('#bkText').value);if(!o||!Array.isArray(o.tasks))throw 0;var d=defaults();S=Object.assign(d,o);S.settings=Object.assign(defaults().settings,o.settings||{});persist();closeModal();render();toast('restored ✿')}catch(x){toast('that text is not a valid backup')}break;
  case 'reset-all':confirmBox('Remove everything and start with an empty planner?','start fresh',function(){S=defaults();persist();render();toast('fresh page ✿')});break;
  case 'mclose':closeModal();break;
  case 'pet':var b=$('#bubble');b.textContent=pick(PHRASES);b.hidden=false;burst(el,['♡','✿']);clearTimeout(act.bt);act.bt=setTimeout(function(){b.hidden=true},2000);break;
  case 'affirm':affI=(affI+1+Math.floor(Math.random()*3))%AFF.length;renderSide();break;
  /* timer */
  case 'tset':T.min=+el.dataset.m;if(!T.run)T.left=T.min*60;renderSide();break;
  case 'tgo':if(T.run){T.run=false;clearInterval(T.id);T.left=Math.max(0,Math.round((T.end-Date.now())/1000))}else{T.run=true;T.end=Date.now()+T.left*1000;T.id=setInterval(tick,500)}updateTimer();break;
  case 'treset':T.run=false;clearInterval(T.id);T.left=T.min*60;updateTimer();break;
  /* tasks */
  case 'toggle':t=find('tasks',id);if(t){t.done=!t.done;if(t.done){t.doneOn=TODAY();burst(el);toast(pick(PRAISE))}else delete t.doneOn;persist();render()}break;
  case 'filter':ui.filter=el.dataset.f;render();break;
  case 'all-done':S.tasks.forEach(function(x){if(x.date===ui.sel&&!x.done){x.done=true;x.doneOn=TODAY()}});persist();render();toast('everything ticked! ✿');break;
  case 'clear-done':confirmBox('Remove all done tasks from this day?','sweep',function(){S.tasks=S.tasks.filter(function(x){return !(x.date===ui.sel&&x.done)});persist();render()});break;
  case 'tmrw':t=find('tasks',id);if(t){t.date=addDays(t.date,1);persist();render();toast('moved to '+fmtShort(t.date))}break;
  case 'carry':t=find('tasks',id);if(t){t.date=TODAY();persist();render()}break;
  case 'carry-all':S.tasks.forEach(function(x){if(!x.done&&x.date<TODAY())x.date=TODAY()});persist();render();break;
  case 'del-task':t=find('tasks',id);ask('tasks',id,'“'+(t?t.text:'task')+'”');break;
  case 'edit-task':t=find('tasks',id);if(!t)break;
    form('edit task ✎',[{k:'text',label:'task',value:t.text,attrs:'maxlength="120" required'},{pair:[{k:'date',type:'date',label:'date',value:t.date,attrs:'min="'+MIN_D+'" max="'+MAX_D+'"'},{k:'time',type:'time',label:'time',value:t.time}]},{pair:[{k:'pri',type:'select',label:'priority',value:t.pri,opts:[['high','💗 high'],['mid','💛 medium'],['low','💙 chill']]},{k:'cat',type:'select',label:'sticker',value:t.cat,opts:CATS.map(function(c){return [c,c]})}]}],
      function(o){if(!o.text.trim())return false;t.text=o.text.trim();t.date=o.date||t.date;t.time=o.time||'';t.pri=o.pri;t.cat=o.cat;persist();render();toast('saved ✿')});break;
  /* water */
  case 'wplus':addWater(Math.max(50,S.settings.glassMl),el);break;
  case 'wsip':addWater(100,el);break;
  case 'wminus':addWater(-Math.max(50,S.settings.glassMl));break;
  case 'wreset':S.water[ui.sel]=0;persist();render();break;
  case 'cup':var gl=Math.max(50,S.settings.glassMl),full=Math.floor((S.water[ui.sel]||0)/gl),i=+el.dataset.i;S.water[ui.sel]=(i+1===full?i:i+1)*gl;persist();render();break;
  /* meals */
  case 'sugg':S.meals.push({id:uid(),date:ui.sel,slot:el.dataset.slot,text:el.dataset.t,kcal:'',done:false});persist();render();break;
  case 'mtoggle':t=find('meals',id);if(t){t.done=!t.done;if(t.done)burst(el,['🍙','♡']);persist();render()}break;
  case 'del-meal':t=find('meals',id);ask('meals',id,'“'+(t?t.text:'meal')+'”');break;
  case 'edit-meal':t=find('meals',id);if(!t)break;
    form('edit meal ✎',[{k:'text',label:'food',value:t.text,attrs:'maxlength="60" required'},{pair:[{k:'kcal',type:'number',label:'calories',value:t.kcal,attrs:'min="0" max="5000"'},{k:'slot',type:'select',label:'meal',value:t.slot,opts:SLOTS.map(function(s){return [s[0],s[2]]})}]}],
      function(o){if(!o.text.trim())return false;t.text=o.text.trim();t.kcal=o.kcal===''?'':Math.max(0,+o.kcal||0);t.slot=o.slot;persist();render();toast('saved ✿')});break;
  /* mood */
  case 'mood':var m=S.mood[ui.sel]||(S.mood[ui.sel]={}),mi=+el.dataset.i;if(m.m===mi){m.m=null}else{m.m=mi;burst(el,[MOODS[mi].e,'✿'])}persist();render();break;
  case 'sleep':var m2=S.mood[ui.sel]||(S.mood[ui.sel]={});m2.sleep=Math.min(14,Math.max(0,(m2.sleep==null?7:m2.sleep)+ +el.dataset.n));persist();render();break;
  case 'energy':var m3=S.mood[ui.sel]||(S.mood[ui.sel]={}),ei=+el.dataset.i;m3.energy=m3.energy===ei?0:ei;persist();render();break;
  /* calendar */
  case 'calnav':var nm=ui.cm+ +el.dataset.n,ny=ui.cy;if(nm<0){nm=11;ny--}if(nm>11){nm=0;ny++}if(ny<2020||ny>2040){toast('the planner covers 2020 – 2040 ✿');break}ui.cm=nm;ui.cy=ny;render();break;
  case 'del-ev':t=find('events',id);ask('events',id,'“'+(t?t.text:'event')+'”');break;
  case 'edit-ev':t=find('events',id);if(!t)break;
    form('edit event ✎',[{k:'text',label:'event',value:t.text,attrs:'maxlength="80" required'},{k:'date',type:'date',label:'date',value:t.date,attrs:'min="'+MIN_D+'" max="'+MAX_D+'"'},{k:'color',type:'swatch',label:'colour',opts:COLS,value:t.color},{k:'yearly',type:'check',label:'🎂 repeats every year',value:t.yearly}],
      function(o){if(!o.text.trim())return false;t.text=o.text.trim();t.date=o.date||t.date;t.color=o.color||'blue';t.yearly=o.yearly;persist();render();toast('saved ✿')});break;
  /* books */
  case 'bfilter':ui.bfilter=el.dataset.f;render();break;
  case 'bpg':t=find('books',id);if(t){setPage(t,t.page+ +el.dataset.n,el)}break;
  case 'bstatus':t=find('books',id);if(t){t.status=el.dataset.s;if(t.status==='done'){t.page=t.pages||t.page;t.fin=TODAY();burst(el,['📚','⭐','♡'])}else delete t.fin;persist();render()}break;
  case 'rate':t=find('books',id);if(t){t.rating=t.rating===+el.dataset.i?0:+el.dataset.i;persist();render()}break;
  case 'del-book':t=find('books',id);ask('books',id,'“'+(t?t.title:'book')+'”');break;
  case 'edit-book':t=find('books',id);if(!t)break;
    form('edit book ✎',[{k:'title',label:'title',value:t.title,attrs:'maxlength="90" required'},{k:'author',label:'author',value:t.author,attrs:'maxlength="60"'},{pair:[{k:'pages',type:'number',label:'total pages',value:t.pages,attrs:'min="1" max="5000"'},{k:'page',type:'number',label:'current page',value:t.page,attrs:'min="0" max="5000"'}]},{k:'status',type:'select',label:'status',value:t.status,opts:[['want','to read'],['reading','reading'],['done','finished']]},{k:'color',type:'swatch',label:'cover colour',opts:COLS,value:t.color}],
      function(o){if(!o.title.trim())return false;t.title=o.title.trim();t.author=o.author.trim();t.pages=Math.max(1,+o.pages||t.pages||1);t.page=Math.min(t.pages,Math.max(0,+o.page||0));t.color=o.color||'blue';
        if(o.status==='done'&&t.status!=='done')t.fin=TODAY();if(o.status!=='done')delete t.fin;t.status=o.status;if(t.status==='done')t.page=t.pages;persist();render();toast('saved ✿')});break;
  /* habits */
  case 'hab':t=find('habits',id);if(t){var d=el.dataset.d;if(t.days[d])delete t.days[d];else{t.days[d]=1;burst(el,['✿','♡'])}persist();render()}break;
  case 'del-hab':t=find('habits',id);ask('habits',id,'the habit “'+(t?t.name:'')+'”');break;
  case 'edit-hab':t=find('habits',id);if(!t)break;
    form('edit habit ✎',[{pair:[{k:'emoji',type:'select',label:'emoji',value:t.emoji,opts:['🌿','💧','📖','🛏️','🧘','🏃','🦷','🎧','✍️','🍎','🎨','🧹'].map(function(x){return [x,x]})},{k:'name',label:'name',value:t.name,attrs:'maxlength="50" required'}]}],
      function(o){if(!o.name.trim())return false;t.emoji=o.emoji;t.name=o.name.trim();persist();render();toast('saved ✿')});break;
  /* notes */
  case 'pin':t=find('notes',id);if(t){t.pin=!t.pin;persist();render()}break;
  case 'ncycle':t=find('notes',id);if(t){var ci=COLS.map(function(c){return c[0]}).indexOf(t.color);t.color=COLS[(ci+1)%COLS.length][0];persist();render()}break;
  case 'del-note':ask('notes',id,'this note');break;
  }
}
function setPage(b,p,el){
  b.page=Math.max(0,Math.min(b.pages||99999,Math.round(p)||0));
  if(b.pages&&b.page>=b.pages&&b.status!=='done'){b.status='done';b.fin=TODAY();toast('finished a book! 📚✨')}
  persist();render();if(b.status==='done'&&el){var c=$('.cover');c&&burst(c,['📚','⭐','♡'])}
}
function formAct(f){
  var fd=new FormData(f),k=f.dataset.form,txt=function(n){return String(fd.get(n)||'').trim()};
  if(k==='task'){if(!txt('text'))return;S.tasks.push({id:uid(),text:txt('text'),date:ui.sel,done:false,pri:fd.get('pri'),cat:fd.get('cat'),time:fd.get('time')||''});toast('added ✿')}
  else if(k==='meal'){if(!txt('text'))return;S.meals.push({id:uid(),date:ui.sel,slot:f.dataset.slot,text:txt('text'),kcal:fd.get('kcal')===''?'':Math.max(0,+fd.get('kcal')||0),done:false})}
  else if(k==='event'){if(!txt('text'))return;S.events.push({id:uid(),date:ui.sel,text:txt('text'),color:fd.get('color')||'blue',yearly:fd.get('yearly')==='on'});toast('event added 📌')}
  else if(k==='book'){if(!txt('title'))return;S.books.push({id:uid(),title:txt('title'),author:txt('author'),pages:Math.max(1,+fd.get('pages')||100),page:0,status:fd.get('status'),rating:0,color:COLS[Math.floor(Math.random()*COLS.length)][0]});toast('book added 📚')}
  else if(k==='habit'){if(!txt('name'))return;S.habits.push({id:uid(),name:txt('name'),emoji:fd.get('emoji'),days:{}});toast('habit added 🌱')}
  else if(k==='note'){if(!txt('text'))return;ui.ncol=fd.get('color')||'butter';S.notes.push({id:uid(),text:txt('text'),color:ui.ncol,pin:false});toast('stuck on ✿')}
  persist();render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el,e)});
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.id==='mform'){if(modalSubmit){var r=modalSubmit(new FormData(f));if(r!==false)closeModal()}else closeModal();return}
  if(f.dataset.form)formAct(f);
});
document.addEventListener('change',function(e){
  var el=e.target,c=el.dataset.chg;if(!c)return;
  if(c==='datepick'&&el.value)setSel(el.value);
  else if(c==='calsel'){ui.cm=+$('#calM').value;ui.cy=+$('#calY').value;render()}
  else if(c==='goal'){S.settings.waterGoal=Math.min(40,Math.max(1,+el.value||8));persist();render()}
  else if(c==='glassml'){S.settings.glassMl=Math.min(1500,Math.max(50,+el.value||250));persist();render()}
  else if(c==='kcalgoal'){S.settings.kcalGoal=Math.min(6000,Math.max(500,+el.value||1800));persist();render()}
  else if(c==='bookgoal'){S.settings.bookGoal=Math.min(365,Math.max(1,+el.value||12));persist();render()}
  else if(c==='bpage'){var b=find('books',el.dataset.id);if(b)setPage(b,+el.value,el)}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.ce){S.settings[el.dataset.ce]=el.textContent;persist();return}
  var k=el.dataset.inp;if(!k)return;
  if(k==='note'){var n=find('notes',el.dataset.id);if(n){n.text=el.value;persist()}}
  else if(k==='mood-note'){var m=S.mood[ui.sel]||(S.mood[ui.sel]={});m.note=el.value;persist()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.ce){e.preventDefault();e.target.blur()}
});
setInterval(function(){if(ui.day0!==TODAY()){ui.day0=TODAY();render()}},60000);
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!S.settings.theme)render()})}catch(e){}
render();
})();
</script>

</body></html>
